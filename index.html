        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            /* 1. 全螢幕背景圖設定（請記得把下面的網址換成你照片的實際網址） */
            background: linear-gradient(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.15)), 
                        url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 60px 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* 2. 個人資訊區塊 */
        .profile {
            margin-bottom: 36px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 放大名字與調整陰影 */
        .name {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* 調整簡介大小與粗細 */
        .bio {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            max-width: 90%;
            margin: 0 auto;
        }

        /* 3. 連結列表區塊 */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 4. 白色半透明框按鈕（磨砂玻璃質感） */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            /* 背景透明，只有細白邊框 */
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            /* 磨砂玻璃特效（模糊背景） */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 按鈕內的 Icon 樣式，微調間距 */
        .link-card i {
            margin-right: 8px;
            font-size: 1.1rem;
        }

        /* 滑鼠懸停效果：變稍微亮一點 */
        .link-card:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
        }

        .link-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
